syntax = "proto3";

package api.diagnostics;

enum DiagnosticsSection {
  Panes = 0;
  Memory = 1;
  Plugins = 2;
  Queues = 3;
  Clients = 4;
}

enum ClientKind {
  Terminal = 0;
  DesktopWindow = 1;
  WebBrowser = 2;
  Watcher = 3;
  Cli = 4;
}

message DiagnosticsRequest {
  // Empty means every section.
  repeated DiagnosticsSection sections = 1;
}

message DiagnosticsReport {
  repeated DiagnosticsSection sections = 1;
  repeated PaneDiagnostics panes = 2;
  // Requested sections the server doesn't know, by wire number.
  repeated DiagnosticsSection unsupported_sections = 3;
  MemoryDiagnostics memory = 4;
  repeated PluginDiagnostics plugins = 5;
  repeated ExecutorThreadDiagnostics plugin_executor_threads = 6;
  repeated QueueDiagnostics queues = 7;
  repeated ClientDiagnostics clients = 8;
}

message MemoryDiagnostics {
  optional uint64 process_rss_bytes = 1;
  uint64 scrollback_bytes_estimate = 2;
  uint64 grapheme_cluster_bytes = 3;
  uint64 grapheme_cluster_entries = 4;
  uint64 grapheme_cluster_limit_bytes = 5;
  uint64 kitty_image_bytes = 6;
  uint64 kitty_image_count = 7;
  uint64 kitty_image_quota_bytes = 8;
  uint64 plugin_linear_memory_bytes = 9;
}

message PluginDiagnostics {
  uint32 plugin_id = 1;
  string location = 2;
  bool is_shared = 3;
  uint32 instances = 4;
  uint32 workers = 5;
  uint64 linear_memory_bytes = 6;
  uint64 largest_linear_memory_bytes = 7;
  uint64 linear_memory_limit_bytes = 8;
  optional uint32 executor_thread = 9;
  repeated uint32 slot_ids = 10;
}

message ClientDiagnostics {
  uint32 client_id = 1;
  // Kept as a number so a kind this build doesn't know survives decoding.
  ClientKind kind = 2;
  bool structured_frames = 3;
  optional uint64 output_backlog = 4;
  uint64 output_backlog_limit = 5;
  optional uint64 last_frame_ack_us = 6;
  optional uint64 frame_awaiting_ack_us = 7;
}

message QueueDiagnostics {
  string name = 1;
  uint64 depth = 2;
  optional uint64 capacity = 3;
}

message ExecutorThreadDiagnostics {
  uint32 index = 1;
  uint32 jobs_in_flight = 2;
  repeated uint32 plugin_ids = 3;
}

// Kept local so this file needs no imports (event.proto imports it).
message DiagnosticsPaneId {
  uint32 id = 1;
  bool is_plugin = 2;
}

message PaneDiagnostics {
  DiagnosticsPaneId pane_id = 1;
  uint32 tab_position = 2;
  GridDiagnostics grid = 3;
  uint32 grid_count = 4;
}

message GridDiagnostics {
  uint32 viewport_rows = 1;
  uint32 viewport_cols = 2;
  uint64 scrollback_lines = 3;
  uint64 scrollback_limit = 4;
  bool in_alternate_screen = 5;
  uint64 scrollback_cells = 6;
  uint64 scrollback_bytes_estimate = 7;
  uint64 lines_discarded = 8;
}
